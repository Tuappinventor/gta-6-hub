<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VICE HUB | Leonida Maps 5.1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090d19;color:#f5f6fc;font:15px system-ui,Arial}
header{padding:13px 16px;background:#141b2b;display:flex;align-items:center;justify-content:space-between;gap:12px}
header b{color:#ff63a7}a{color:#ffc2de;text-decoration:none}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);height:calc(100dvh - 54px)}
aside{background:#111a2b;padding:14px;overflow:auto}h2{margin:0 0 10px}
input,select,button{font:inherit;border:1px solid #4c5673;background:#1c2942;color:white;border-radius:9px;padding:10px}
input,select{width:100%;margin-bottom:9px}button{cursor:pointer}
#items{display:grid;gap:7px;margin-top:10px}.item{width:100%;text-align:left}.item small{display:block;color:#b7c5d8}
#stage{position:relative;overflow:hidden;min-height:0;background:#071b2b;touch-action:none;user-select:none;cursor:grab}
#stage.dragging{cursor:grabbing}
#world{position:absolute;top:0;left:0;width:2805px;height:3840px;transform-origin:0 0;will-change:transform}
#poster{display:block;width:100%;height:100%;pointer-events:none}
.marker{position:absolute;transform:translate(-50%,-100%);border:2px solid white;background:#ec3e93;border-radius:50%;width:34px;height:34px;padding:0;display:grid;place-items:center;box-shadow:0 2px 10px #000a;z-index:2;touch-action:none}
.marker.done{background:#119c79}
#controls{position:absolute;top:12px;right:12px;z-index:5;display:flex;flex-direction:column;gap:7px}
#controls button{width:44px;height:44px;background:#10192de8}
#detail{position:absolute;left:12px;bottom:12px;z-index:5;background:#121d32ed;border:1px solid #48506c;border-radius:12px;padding:12px;max-width:min(360px,calc(100% - 24px));display:none}
#detail button{margin-top:8px}
#notice{position:absolute;bottom:8px;right:8px;background:#10192bc9;padding:5px 7px;border-radius:6px;font-size:10px;max-width:190px;pointer-events:none}
#detail:not([hidden])~#notice{display:none}
#status{color:#ffb2d5;font-size:13px}
@media(max-width:700px){.layout{display:flex;flex-direction:column;height:calc(100dvh - 53px)}#stage{flex:1;min-height:55vh}aside{order:2;max-height:32vh;padding:10px}#items{grid-template-columns:repeat(2,minmax(0,1fr))}header{font-size:14px}}
</style></head><body>
<header><strong>VICE <b>HUB</b> · LEONIDA MAPS 5.1</strong><a href="./index.html">Volver a VICE HUB</a></header>
<div class="layout">
<aside><h2>Explora Leonida</h2><input id="search" type="search" placeholder="Buscar ubicación...">
<select id="filter"><option value="all">Todas las categorías</option><option value="ciudad">Ciudades</option><option value="region">Regiones</option><option value="isla">Islas</option><option value="aeropuerto">Aeropuertos</option></select>
<div id="count"></div><p id="status"></p><div id="items"></div>
<p style="color:#aebdd2;font-size:12px">Ubicaciones iniciales aproximadas. El progreso se guarda en este dispositivo.</p></aside>
<main id="stage" aria-label="Mapa interactivo de Leonida">
<div id="world"><img id="poster" src="./assets/Leonida_Map_Poster.jpg" alt="Mapa de Leonida" draggable="false"></div>
<div id="controls"><button id="plus" aria-label="Ampliar">+</button><button id="minus" aria-label="Reducir">−</button><button id="fit" aria-label="Mostrar todo">⤢</button></div>
<div id="detail" hidden></div><div id="notice">Mapa aportado por el usuario · Verificar derechos de reutilización</div>
</main></div>
<script>
(()=>{
'use strict';
const locations=[
['vice-city','Vice City','ciudad',714,750],['vice-beach','Vice Beach','ciudad',944,709],
['port-gellhorn','Port Gellhorn','ciudad',318,532],['hamlet','Hamlet','ciudad',592,1027],
['bonanza','Bonanza','ciudad',506,210],['grayson','Grayson','ciudad',410,330],
['millport','Millport','ciudad',724,347],['ambrosia','Ambrosia','ciudad',601,539],
['capri','Capri','ciudad',296,794],['southwind','Southwind','ciudad',360,1283],
['lummox','Lummox County','region',520,300],['kelly','Kelly County','region',462,600],
['leonard','Leonard County','region',748,540],['vice-dale','Vice-Dale County','region',765,863],
['mariana','Mariana County','region',452,1094],['draper','Draper Island','isla',260,449],
['hyde','Hyde Island','isla',630,167],['vc-airport','VCIA','aeropuerto',605,855],
['mile-zero','Mile Zero Air Station','aeropuerto',290,1297]
].map(([id,name,type,x,y])=>({id,name,type,x,y}));
const $=id=>document.getElementById(id),stage=$('stage'),world=$('world'),poster=$('poster'),detail=$('detail');
const icons={ciudad:'🏙️',region:'🗺️',isla:'🏝️',aeropuerto:'✈️'};
const key='vicehub-maps-4-discovered';
let discovered;try{discovered=new Set(JSON.parse(localStorage.getItem(key)||'[]'))}catch{discovered=new Set()}
let iw=1122,ih=1536,base=1,zoom=1,tx=0,ty=0,active=null;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function render(){world.style.transform=`translate(${tx}px,${ty}px) scale(${base*zoom})`}
function fit(){
 const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;
 base=Math.min(w/iw,h/ih);zoom=1;tx=(w-iw*base)/2;ty=(h-ih*base)/2;render();
}
function zoomAt(f,cx,cy){
 const old=base*zoom,nz=clamp(zoom*f,1,8),ns=base*nz;
 const wx=(cx-tx)/old,wy=(cy-ty)/old;
 tx=cx-wx*ns;ty=cy-wy*ns;zoom=nz;render();
}
function save(){try{localStorage.setItem(key,JSON.stringify([...discovered]))}catch{}}
function openDetail(p){
 active=p;detail.hidden=false;detail.style.display='block';
 detail.replaceChildren();
 const title=document.createElement('strong');title.textContent=p.name;
 const text=document.createElement('p');text.textContent=`${p.type} · Posición inicial aproximada`;
 const btn=document.createElement('button');btn.textContent=discovered.has(p.id)?'✓ Visitado · Desmarcar':'Marcar como visitado';
 btn.onclick=()=>{discovered.has(p.id)?discovered.delete(p.id):discovered.add(p.id);save();draw();openDetail(p)};
 const close=document.createElement('button');close.textContent='Cerrar';close.style.marginLeft='8px';close.onclick=()=>{detail.hidden=true;detail.style.display='none'};
 detail.append(title,text,btn,close);
}
function draw(){
 world.querySelectorAll('.marker').forEach(n=>n.remove());
 const q=$('search').value.toLocaleLowerCase('es').trim(),f=$('filter').value;
 const shown=locations.filter(p=>(f==='all'||p.type===f)&&p.name.toLocaleLowerCase('es').includes(q));
 const list=$('items');list.replaceChildren();
 for(const p of shown){
  const m=document.createElement('button');m.className='marker'+(discovered.has(p.id)?' done':'');
  m.style.left=(p.x/1122*100)+'%';m.style.top=(p.y/1536*100)+'%';
  m.textContent=icons[p.type];m.title=p.name;m.setAttribute('aria-label',p.name);
  m.onclick=e=>{e.stopPropagation();openDetail(p)};world.append(m);
  const b=document.createElement('button');b.className='item';b.textContent=p.name;
  const small=document.createElement('small');small.textContent=`${icons[p.type]} ${p.type}${discovered.has(p.id)?' · ✓ Visitado':''}`;b.append(small);
  b.onclick=()=>{const s=base*zoom;zoom=Math.max(zoom,1.7);const scale=base*zoom;tx=stage.clientWidth/2-p.x/1122*iw*scale;ty=stage.clientHeight/2-p.y/1536*ih*scale;render();openDetail(p)};
  list.append(b);
 }
 $('count').textContent=`${shown.length} lugares · ${discovered.size} visitados`;
}
poster.onload=()=>{
 iw=poster.naturalWidth;ih=poster.naturalHeight;
 world.style.width=iw+'px';world.style.height=ih+'px';
 $('status').textContent=`Imagen cargada: ${iw} × ${ih} píxeles`;
 fit();draw();
};
poster.onerror=()=>{$('status').textContent='No se ha podido cargar assets/Leonida_Map_Poster.jpg'};
if(poster.complete&&poster.naturalWidth)poster.onload();
$('search').oninput=draw;$('filter').onchange=draw;
$('plus').onclick=()=>zoomAt(1.5,stage.clientWidth/2,stage.clientHeight/2);
$('minus').onclick=()=>zoomAt(1/1.5,stage.clientWidth/2,stage.clientHeight/2);
$('fit').onclick=fit;
stage.addEventListener('wheel',e=>{e.preventDefault();const r=stage.getBoundingClientRect();zoomAt(e.deltaY<0?1.18:1/1.18,e.clientX-r.left,e.clientY-r.top)},{passive:false});
const pointers=new Map();let drag=null,pinch=null;
stage.addEventListener('pointerdown',e=>{
 if(e.target.closest('button'))return;
 stage.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pointers.size===1){drag={x:e.clientX,y:e.clientY,tx,ty};stage.classList.add('dragging')}
 if(pointers.size===2){const a=[...pointers.values()];pinch={distance:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};drag=null}
});
stage.addEventListener('pointermove',e=>{
 if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pointers.size===2){const a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinch?.distance){const r=stage.getBoundingClientRect();zoomAt(d/pinch.distance,(a[0].x+a[1].x)/2-r.left,(a[0].y+a[1].y)/2-r.top)}pinch={distance:d}}
 else if(drag){tx=drag.tx+e.clientX-drag.x;ty=drag.ty+e.clientY-drag.y;render()}
});
function end(e){pointers.delete(e.pointerId);if(pointers.size===0){drag=null;pinch=null;stage.classList.remove('dragging')}else if(pointers.size===1){const p=[...pointers.values()][0];drag={x:p.x,y:p.y,tx,ty};pinch=null}}
stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);
window.addEventListener('resize',fit);
})();
</script></body></html>
